name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this revision (main production; other branches require preview_pr)
        type: boolean
        default: false
      preview_pr:
        description: Open same-repository PR number for a manual preview
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated icons
        run: |
          go run ./cmd/icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/icons/favicon.ico -o resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- assets/icons resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native application
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o build/game.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check WebAssembly compilation
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o build/game.wasm .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test simulation without a display
        run: |
          mkdir -p build
          go test -race -count=1 -coverprofile=build/coverage.out ./internal/simulation
          go tool cover -func=build/coverage.out | tee build/coverage.txt
          go tool cover -html=build/coverage.out -o build/coverage.html
          echo '### Simulation coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: simulation-coverage
          path: |
            build/coverage.out
            build/coverage.txt
            build/coverage.html
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: go run ./cmd/web
      - run: node scripts/package-pages.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: golgo-web
          path: build/pages
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [build, simulation, browser]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: Warsinger/cloudflare-pages-deploy/.github/workflows/pages.yml@8ed38d395ac53e4d2172f0ad18e4b7fe0abfd014
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    with:
      deployment-ref: 8ed38d395ac53e4d2172f0ad18e4b7fe0abfd014
      artifact-name: golgo-web
      project-name: golgo
      hostname: golgo.pages.dev
      title: Game of Life
      preview-pr: ${{ inputs.preview_pr }}
      comment-marker: '<!-- golgo-preview -->'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
