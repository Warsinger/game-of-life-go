<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Watch simple rules become living patterns."><title>Conway’s Game of Life</title><link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256"><link rel="icon" type="image/png" href="icon-192.png" sizes="192x192"><link rel="icon" type="image/png" href="icon-512.png" sizes="512x512"><link rel="apple-touch-icon" href="icon-180.png" sizes="180x180"><link rel="stylesheet" href="styles.css"><script type="module" src="launcher.js"></script></head>
<body data-app="life"><header><div><h1>Conway’s Game of Life</h1><p>Watch simple rules become living patterns.</p></div><nav><a href="https://eelwehttam.pages.dev/">All apps ↗</a></nav></header>
<main><section class="stage" aria-label="Conway’s Game of Life"><div class="screen"><iframe id="game" data-src="game.html" title="Conway’s Game of Life game" allow="autoplay; fullscreen" tabindex="0"></iframe></div>
<div class="toolbar"><button id="focus" type="button">Focus game</button><button id="fullscreen" type="button">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Loading…</p><p class="keys"><strong>R</strong> randomize · <strong>+ / −</strong> speed · <strong>L</strong> grid · <strong>D</strong> diagnostics · <strong>F</strong> fullscreen</p></section>
<aside class="settings"><h2>Settings</h2><form><label>Width · cells<input name="width" type="number" value="80" min="1" max="4096" step="1" required></label><label>Height · cells<input name="height" type="number" value="80" min="1" max="4096" step="1" required></label><label>Cell size · pixels<input name="cell" type="number" value="10" min="1" max="8192" step="1" required></label><label>Live-cell probability<input name="variance" type="number" value="0.5" min="0" max="1" step="0.01" required></label><label>Nominal speed · 0 pauses<input name="speed" type="number" value="15" min="0" max="60" step="1" required></label><label><input type="checkbox" name="debug">Show diagnostics</label><label><input type="checkbox" name="lines">Show grid lines</label><button class="primary" type="submit">Apply / restart</button><p class="hint">Restart creates a fresh random board. Edges do not wrap. Speed follows the original game timing.</p></form></aside></main>
<footer class="project-footer"><a href="https://eelwehttam.pages.dev/">All apps</a> · <a href="https://github.com/Warsinger/game-of-life-go">Source</a> · <a href="https://github.com/Warsinger/game-of-life-go/issues">Report an issue</a></footer><noscript>This application requires JavaScript and WebAssembly.</noscript></body></html>
